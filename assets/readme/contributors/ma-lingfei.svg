<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Lingfei Ma contributor avatar</title>
  <desc id="desc">Blue-green circular avatar with the initials LM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#237a86"/>
      <stop offset="1" stop-color="#123b56"/>
