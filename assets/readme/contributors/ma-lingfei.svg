  </defs>
  <circle cx="80" cy="80" r="76" fill="url(#bg)"/>
  <circle cx="80" cy="80" r="73" fill="none" stroke="#9ce9e0" stroke-width="2" opacity=".8"/>
  <text x="80" y="92" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#ffffff">LM</text>
</svg>
